    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.getElementById('phonemenu');

        function setMenu(open) {
            navLinks.classList.toggle('is-open', open);
            menuToggle.classList.toggle('is-open', open);
            menuToggle.setAttribute('aria-expanded', String(open));
            menuToggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
        }

        menuToggle.addEventListener('click', () => {
            setMenu(!navLinks.classList.contains('is-open'));
        });

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', event => {
                const target = document.querySelector(anchor.getAttribute('href'));

                if (!target) {
                    return;
                }

                event.preventDefault();
                window.scrollTo({
                    top: target.getBoundingClientRect().top + window.scrollY - 96,
                    behavior: 'smooth'
                });
                setMenu(false);
            });
        });

        const revealItems = document.querySelectorAll('.reveal');

        if ('IntersectionObserver' in window) {
            const revealObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.14 });

            revealItems.forEach(item => revealObserver.observe(item));
        } else {
            revealItems.forEach(item => item.classList.add('is-visible'));
        }

        const form = document.forms['submit-to-google-sheet'];
        const msg = document.getElementById('msg');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwSoSsLYrVtpNyfQXjS7D5I4TIleF0uIjz1uC3u7a1HLdRMJP9hs7-D_TWmDptOIsvRrA/exec';

        if (form && msg) {
            form.addEventListener('submit', event => {
                event.preventDefault();
                msg.textContent = 'Sending...';

                fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                    .then(() => {
                        msg.textContent = 'Message sent!';
                        setTimeout(() => {
                            msg.textContent = '';
                        }, 5000);
                        form.reset();
                    })
                    .catch(error => {
                        msg.textContent = 'Message could not be sent. Please email me directly.';
                        console.error('Error!', error.message);
                    });
            });
        }
    </script>
