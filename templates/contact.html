{% extends "base.html" %}

{% block title %}Contact | {{ profile.name }}{% endblock %}

{% block content %}
<section class="page-hero compact-hero">
    <div class="container page-copy reveal">
        <h1>Let's Connect!</h1>
    </div>
</section>

<section class="content-section">
    <div class="container contact-layout">
        <div class="contact-left reveal">
            <div class="contact-links">
                <a href="mailto:{{ profile.email }}">
                    <span>Email</span>
                    {{ profile.email }}
                </a>
                <a href="tel:+17738441041">
                    <span>Phone</span>
                    {{ profile.phone }}
                </a>
            </div>
            <a href="{{ profile.resume }}" download class="btn btn2">Download Resume</a>
        </div>

        <div class="contact-right reveal">
            <form name="submit-to-google-sheet">
                <label class="sr-only" for="name">Your Name</label>
                <input id="name" type="text" name="Name" placeholder="Your Name" autocomplete="name" required>

                <label class="sr-only" for="email">Your Email</label>
                <input id="email" type="email" name="Email" placeholder="Your Email" autocomplete="email" required>

                <label class="sr-only" for="message">Your Message</label>
                <textarea id="message" name="Message" rows="6" placeholder="Your Message"></textarea>

                <button type="submit" class="btn btn2">Submit</button>
                <span id="msg" role="status" aria-live="polite"></span>
            </form>
        </div>
    </div>
</section>
{% endblock %}
