<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ profile.name }} is a {{ profile.role }} with experience in embedded systems, hardware, software, automation, and machine safety.">
    <link rel="icon" href="/static/Images/JC.png" type="image/png">
    <link rel="preload" href="/static/Images/Website_Header.png" as="image">
    <title>{% block title %}{{ profile.name }} | {{ profile.role }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{{ body_class|default('') }}">
    <header id="header" class="site-header">
        <div class="nav-container">
            <nav aria-label="Primary navigation">
                <a href="{{ url_for('index') }}" class="brand" aria-label="{{ profile.name }} home">
                    <img src="/static/Images/JC.png" class="logo" alt="JC monogram">
                </a>
                <button class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="phonemenu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul id="phonemenu" class="nav-links">
                    {% for label, endpoint in nav_links %}
                    <li><a href="{{ url_for(endpoint) }}" class="{% if request.endpoint == endpoint %}is-active{% endif %}">{{ label }}</a></li>
                    {% endfor %}
                </ul>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; 2026 - {{ profile.name }}. Kachow!</p>
        </div>
    </footer>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navLinks = document.getElementById('phonemenu');

        function setMenu(open) {
            if (!menuToggle || !navLinks) {
                return;
            }

            navLinks.classList.toggle('is-open', open);
            menuToggle.classList.toggle('is-open', open);
            menuToggle.setAttribute('aria-expanded', String(open));
            menuToggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
        }

        if (menuToggle && navLinks) {
            menuToggle.addEventListener('click', event => {
                event.stopPropagation();
                setMenu(!navLinks.classList.contains('is-open'));
            });

            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => setMenu(false));
            });

            document.addEventListener('click', event => {
                if (!event.target.closest('.site-header')) {
                    setMenu(false);
                }
            });

            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') {
                    setMenu(false);
                }
            });
        }

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', event => {
                const target = document.querySelector(anchor.getAttribute('href'));

                if (!target) {
                    return;
                }

                event.preventDefault();
                window.scrollTo({
                    top: target.getBoundingClientRect().top + window.scrollY - 96,
                    behavior: 'smooth'
                });
                setMenu(false);
            });
        });

        const revealItems = document.querySelectorAll('.reveal');

        if ('IntersectionObserver' in window) {
            const revealObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.14 });

            revealItems.forEach(item => revealObserver.observe(item));
        } else {
            revealItems.forEach(item => item.classList.add('is-visible'));
        }

        const form = document.forms['submit-to-google-sheet'];
        const msg = document.getElementById('msg');
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwSoSsLYrVtpNyfQXjS7D5I4TIleF0uIjz1uC3u7a1HLdRMJP9hs7-D_TWmDptOIsvRrA/exec';

        if (form && msg) {
            form.addEventListener('submit', event => {
                event.preventDefault();
                msg.textContent = 'Sending...';

                fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                    .then(() => {
                        msg.textContent = 'Message sent!';
                        setTimeout(() => {
                            msg.textContent = '';
                        }, 5000);
                        form.reset();
                    })
                    .catch(error => {
                        msg.textContent = 'Message could not be sent. Please email me directly.';
                        console.error('Error!', error.message);
                    });
            });
        }
    </script>
</body>
</html>
